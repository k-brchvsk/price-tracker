name: Pricely Pipelines

on:
  pull_request:
    branches: [ trunk ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detekt:
    name: detekt
    if: ${{ true }}
    uses: ./.github/workflows/_detekt.yml

  unit-tests:
    name: unit-tests
    uses: ./.github/workflows/_unit_tests.yml

  instrumented-ui-tests:
    name: instrumented-ui-tests
    uses: ./.github/workflows/_instrumented_ui_tests.yml
