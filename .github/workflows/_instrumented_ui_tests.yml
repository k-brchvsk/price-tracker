name: _instrumented_ui_tests

on:
  workflow_call: { }

jobs:
  instrumented-ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run Compose / Android instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            ./gradlew \
              :core:design-system:connectedDebugAndroidTest \
              :feature:feed:internal:connectedDebugAndroidTest \
              :feature:symbol-details:internal:connectedDebugAndroidTest \
              --no-daemon \
              --stacktrace

      - name: Upload Android test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-reports
          path: |
            **/build/reports/androidTests/connected/**
          if-no-files-found: ignore
